<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Fotbalové Tipy: Měsíční Soutěž</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        :root {
            --dark-bg-start: #0f0f23; --dark-bg-end: #1a1a2e;
            --dark-text: #ffffff; --dark-card-bg: rgba(255, 255, 255, 0.08);
            --dark-card-border: rgba(255, 255, 255, 0.15); --dark-input-bg: rgba(255, 255, 255, 0.15);
            --dark-input-border: rgba(255, 255, 255, 0.3); --dark-header-color: #ffffff;

            --light-bg-start: #f0f4f8; --light-bg-end: #d9e2ec;
            --light-text: #333333; --light-card-bg: rgba(255, 255, 255, 0.95);
            --light-card-border: rgba(0, 0, 0, 0.08); --light-input-bg: rgba(255, 255, 255, 0.9);
            --light-input-border: rgba(0, 0, 0, 0.15); --light-header-color: #0f0f23;

            --primary-gradient: linear-gradient(135deg, #667eea, #764ba2);
            --success-gradient: linear-gradient(135deg, #43e97b, #38f9d7);
            --danger-gradient: linear-gradient(135deg, #fa709a, #fee140);
            --warning-gradient: linear-gradient(135deg, #4facfe, #00f2fe);
            --info-gradient: linear-gradient(135deg, #00c6fb, #005bea);
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
            background: var(--dark-bg-start);
            background-image: linear-gradient(135deg, var(--dark-bg-start) 0%, var(--dark-bg-end) 100%);
            color: var(--dark-text);
            min-height: 100vh;
        }
        body.light-mode {
            background-image: linear-gradient(135deg, var(--light-bg-start) 0%, var(--light-bg-end) 100%);
            color: var(--light-text);
        }

        h1, h2, h3, h4, h5 { font-family: 'Oswald', sans-serif; font-weight: 700; }
        body.light-mode h1, body.light-mode h2, body.light-mode h3, body.light-mode h4, body.light-mode h5 { color: var(--light-header-color); }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: var(--dark-card-bg); backdrop-filter: blur(10px);
            padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--dark-card-border); max-width: 450px; width: 100%;
        }
        body.light-mode .login-card {
            background: var(--light-card-bg); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--light-card-border);
        }

        .navbar {
            background: rgba(15, 15, 35, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        body.light-mode .navbar {
            background: rgba(255, 255, 255, 0.9); border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }
        .navbar-brand, .nav-link { color: #ffffff !important; }
        body.light-mode .navbar-brand, body.light-mode .nav-link { color: #0f0f23 !important; }
        .nav-link.active { font-weight: bold; border-bottom: 2px solid #4facfe; }
        #admin-nav-item .nav-link { color: #f5576c !important; }
        #admin-nav-item .nav-link.active { border-bottom-color: #f5576c; }

        .card {
            background: var(--dark-card-bg); border: 1px solid var(--dark-card-border);
            border-radius: 20px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px); margin-bottom: 20px;
        }
        body.light-mode .card { background: var(--light-card-bg); border: 1px solid var(--light-card-border); }

        .form-control, .form-select {
            background: var(--dark-input-bg); color: var(--dark-text); border: 1px solid var(--dark-input-border);
            border-radius: 15px; padding: 10px 15px; transition: all 0.3s ease; backdrop-filter: blur(5px);
        }
        body.light-mode .form-control, body.light-mode .form-select {
            background: var(--light-input-bg); color: var(--light-text); border: 1px solid var(--light-input-border);
        }
        .form-control:focus, .form-select:focus {
            border-color: #4facfe; box-shadow: 0 0 15px rgba(79, 172, 254, 0.3);
            background: var(--dark-input-bg); color: var(--dark-text);
        }
        body.light-mode .form-control:focus, body.light-mode .form-select:focus {
            background: var(--light-input-bg); color: var(--light-text);
        }

        .btn {
            border-radius: 25px; padding: 10px 25px; font-weight: 500;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            color: #ffffff; border: none; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3); color: #ffffff; }
        .btn-primary { background: var(--primary-gradient); } .btn-success { background: var(--success-gradient); }
        .btn-danger { background: var(--danger-gradient); } .btn-warning { background: var(--warning-gradient); }
        .btn-info { background: var(--info-gradient); }
        
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1090; }

        .table {
            border-radius: 20px; overflow: hidden; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            background: var(--dark-card-bg); backdrop-filter: blur(10px); border: none;
        }
        .table thead th { background: var(--info-gradient); color: #ffffff; border: none; text-transform: uppercase; }
        .table td, .table th { border-color: rgba(255, 255, 255, 0.1) !important; color: var(--dark-text); vertical-align: middle; }
        body.light-mode .table td, body.light-mode .table th { border-color: rgba(0, 0, 0, 0.08) !important; color: var(--light-text); }
        .table-hover tbody tr:hover { background-color: rgba(255, 255, 255, 0.05); }
        body.light-mode .table-hover tbody tr:hover { background-color: rgba(0, 0, 0, 0.03); }

        .match-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px;
        }
        body.light-mode .match-header { border-bottom: 1px solid rgba(0, 0, 0, 0.08); }
        .match-score { font-size: 1.2rem; font-weight: bold; color: #4facfe; }

        .player-tip-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 10px; }
        .player-tip-row span:first-child { flex-basis: 150px; flex-shrink: 0; font-weight: 500; }
        .evaluation-status-display { font-weight: bold; padding: 5px 10px; border-radius: 10px; font-size: 0.9em; }
        .status-ok { background-color: rgba(67, 233, 123, 0.2); color: #43e97b; }
        .status-spatne { background-color: rgba(250, 112, 154, 0.2); color: #fa709a; }
        .status-nevyhodnoceno { background-color: rgba(255, 255, 255, 0.1); }
        body.light-mode .status-nevyhodnoceno { background-color: rgba(0, 0, 0, 0.05); }

        .admin-controls { border: 1px solid #f5576c; }
        .admin-controls h2 { color: #f5576c; }

        .loading-spinner {
            width: 3rem; height: 3rem; border: 0.3rem solid #4facfe;
            border-top-color: transparent; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .player-tip-row { flex-wrap: wrap; }
            .player-tip-row span:first-child { flex-basis: 100%; margin-bottom: 5px; }
        }
        @media (max-width: 576px) {
            .btn { width: 100%; margin-bottom: 10px; }
            .navbar-nav .btn { width: auto; margin-bottom: 0; }
            .navbar-collapse .d-flex { flex-direction: column; align-items: stretch !important; }
            .navbar-collapse .d-flex .btn { margin-top: 10px; }
        }
    </style>
</head>
<body class="d-flex flex-column">
    
    <!-- Login Page -->
    <div id="login-page" class="login-container">
        <div class="login-card text-center">
            <h1><i class="fas fa-futbol"></i> Fotbalové Tipy</h1>
            <p class="lead mb-4">Měsíční tipovací soutěž</p>
            <div class="mb-3">
                <input type="text" class="form-control" id="username" placeholder="Uživatelské jméno">
            </div>
            <div class="mb-4">
                <input type="password" class="form-control" id="pin" placeholder="PIN (4 číslice)" maxlength="4" inputmode="numeric">
            </div>
            <button class="btn btn-primary w-100 mb-2" onclick="login()">Přihlásit se <i class="fas fa-key"></i></button>
            <button class="btn btn-success w-100" onclick="register()">Registrovat se <i class="fas fa-user-plus"></i></button>
        </div>
    </div>

    <!-- Main App Content -->
    <div id="main-content" class="d-none flex-grow-1 d-flex flex-column">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"><i class="fas fa-futbol me-2"></i>Fotbalové Tipy</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link active" href="#" data-section="dashboard"><i class="fas fa-home me-1"></i>Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="#" data-section="matches"><i class="fas fa-soccer-ball me-1"></i>Zápasy</a></li>
                        <li class="nav-item"><a class="nav-link" href="#" data-section="leaderboard"><i class="fas fa-trophy me-1"></i>Žebříček</a></li>
                        <li class="nav-item"><a class="nav-link" href="#" data-section="profile"><i class="fas fa-user me-1"></i>Můj Profil</a></li>
                        <li class="nav-item d-none" id="admin-nav-item"><a class="nav-link" href="#" data-section="admin"><i class="fas fa-shield-alt me-1"></i>Admin</a></li>
                    </ul>
                    <div class="d-flex align-items-center">
                        <span class="navbar-text me-3 d-none d-lg-block" id="logged-in-user"></span>
                        <button class="btn btn-warning btn-sm me-2" onclick="toggleDarkMode()" aria-label="Přepnout režim"><i class="fas fa-moon" id="dark-mode-icon"></i></button>
                        <button class="btn btn-danger btn-sm" onclick="logout()"><i class="fas fa-sign-out-alt me-1"></i>Odhlásit</button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="container mt-4 flex-grow-1">
            <!-- App Sections -->
            <section id="dashboard-section" class="app-section"></section>
            <section id="matches-section" class="app-section d-none"></section>
            <section id="leaderboard-section" class="app-section d-none"></section>
            <section id="profile-section" class="app-section d-none"></section>
            <section id="admin-section" class="app-section d-none"></section>
        </main>
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header"><strong class="me-auto">Upozornění</strong><button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button></div>
            <div class="toast-body"></div>
        </div>
    </div>
    
    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        // --- CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyB-gLlgyPKNf4z1cfl1Z1N1qu79FvO_3A8",
            authDomain: "ftbapp-ded2c.firebaseapp.com",
            databaseURL: "https://ftbapp-ded2c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "ftbapp-ded2c",
            storageBucket: "ftbapp-ded2c.appspot.com",
            messagingSenderId: "239337886217",
            appId: "1:239337886217:web:9b67dffaba23d6e86dded8"
        };
        const ADMIN_USERNAME = 'kuba';

        // --- INITIALIZATION ---
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let currentPlayer = null;
        let allUsers = {};
        let allMatches = [];

        // --- AUTHENTICATION ---
        const register = () => {
            const username = document.getElementById('username').value.trim().toLowerCase();
            const pin = document.getElementById('pin').value.trim();
            if (username.length < 3) return showToast('Jméno musí mít alespoň 3 znaky!', 'danger');
            if (!/^\d{4}$/.test(pin)) return showToast('PIN musí být 4 číslice!', 'danger');
            
            database.ref(`users/${username}`).once('value', snapshot => {
                if (snapshot.exists()) return showToast('Uživatel s tímto jménem již existuje!', 'danger');
                
                database.ref(`users/${username}`).set({ pin, registeredAt: new Date().toISOString() });
                sessionStorage.setItem('currentPlayer', username);
                showToast(`Registrace úspěšná, vítej ${username}! 🎉`, 'success');
                initApp();
            }).catch(handleFirebaseError);
        };

        const login = () => {
            const username = document.getElementById('username').value.trim().toLowerCase();
            const pin = document.getElementById('pin').value.trim();
            if (!username || !pin) return showToast('Zadejte jméno a PIN.', 'warning');

            database.ref(`users/${username}/pin`).once('value', snapshot => {
                if (snapshot.val() === pin) {
                    sessionStorage.setItem('currentPlayer', username);
                    initApp();
                } else {
                    showToast('Špatné jméno nebo PIN!', 'danger');
                }
            }).catch(handleFirebaseError);
        };

        const logout = () => {
            sessionStorage.removeItem('currentPlayer');
            location.reload();
        };

        // --- APP LOGIC ---
        const initApp = async () => {
            currentPlayer = sessionStorage.getItem('currentPlayer');
            if (!currentPlayer) return;

            document.getElementById('login-page').classList.add('d-none');
            document.getElementById('main-content').classList.remove('d-none');
            document.getElementById('logged-in-user').textContent = `Uživatel: ${currentPlayer}`;
            
            if (currentPlayer === ADMIN_USERNAME) {
                document.getElementById('admin-nav-item').classList.remove('d-none');
            }
            
            setupNavigation();
            
            try {
                allMatches = await loadMatchesFromFile();
                setupFirebaseListeners();
                showSection('dashboard');
            } catch (error) {
                showToast(error.message, 'danger');
                document.getElementById('matches-section').innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
            }
        };

        const setupFirebaseListeners = () => {
            database.ref('users').on('value', snapshot => {
                allUsers = snapshot.val() || {};
                renderAllSections();
            }, handleFirebaseError);
        };

        const loadMatchesFromFile = async () => {
            try {
                const response = await fetch('matches.txt');
                if (!response.ok) throw new Error('Soubor matches.txt nebyl nalezen nebo k němu nemám přístup.');
                const text = await response.text();
                const lines = text.split('\n').filter(line => line.trim() !== '');
                
                if (lines.length === 0) throw new Error('Soubor matches.txt je prázdný.');

                let currentRound = '';
                const rounds = [];
                let roundIndex = -1;

                lines.forEach(line => {
                    const isRoundTitle = !line.includes('vs.');
                    if (isRoundTitle) {
                        currentRound = line.trim();
                        rounds.push({ round: currentRound, matches: [] });
                        roundIndex++;
                    } else {
                        if (roundIndex > -1) {
                             const matchIndex = rounds[roundIndex].matches.length;
                             rounds[roundIndex].matches.push({
                                 id: `r${roundIndex}m${matchIndex}`, // deterministic ID
                                 name: line.trim()
                             });
                        }
                    }
                });
                return rounds;
            } catch (error) {
                console.error("Chyba při načítání zápasů:", error);
                throw error; // Re-throw to be caught by initApp
            }
        };
        
        // --- RENDERING ---
        const renderAllSections = () => {
            renderDashboard();
            renderLeaderboard();
            renderMatches();
            renderProfile();
            if(currentPlayer === ADMIN_USERNAME) renderAdminPanel();
        };
        
        const renderDashboard = async () => {
            const pointsSnap = await database.ref(`points/${currentPlayer}`).once('value');
            const betsSnap = await database.ref(`totalBets/${currentPlayer}`).once('value');
            const totalBetsSnap = await database.ref('totalBets').once('value');
            
            const myPoints = pointsSnap.val() || 0;
            const myBet = betsSnap.val() || 0;
            const totalPool = Object.values(totalBetsSnap.val() || {}).reduce((sum, bet) => sum + bet, 0);

            const monthNames = ["Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"];

            document.getElementById('dashboard-section').innerHTML = `
                <h2 class="mb-4"><i class="fas fa-chart-line me-2"></i>Přehled soutěže</h2>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <div class="card p-4 h-100">
                            <h3><i class="fas fa-coins me-2"></i>Celkový bank</h3>
                            <p class="fs-4 mb-0">${totalPool.toLocaleString('cs-CZ')} Kč</p>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="card p-4 h-100">
                            <h3><i class="fas fa-calendar-alt me-2"></i>Aktuální měsíc</h3>
                            <p class="fs-4 mb-0">${monthNames[new Date().getMonth()]} ${new Date().getFullYear()}</p>
                        </div>
                    </div>
                </div>
                <div class="card p-4">
                    <h3><i class="fas fa-user-circle me-2"></i>Můj stav</h3>
                    <div class="row pt-2">
                        <div class="col-md-6"><p class="mb-0">Body: <span class="fw-bold fs-5">${myPoints}</span></p></div>
                        <div class="col-md-6"><p class="mb-0">Celková sázka: <span class="fw-bold fs-5">${myBet.toLocaleString('cs-CZ')} Kč</span></p></div>
                    </div>
                </div>
            `;
        };

        const renderLeaderboard = async () => {
            const pointsSnap = await database.ref('points').once('value');
            const betsSnap = await database.ref('totalBets').once('value');
            const points = pointsSnap.val() || {};
            const totalBets = betsSnap.val() || {};

            const playerList = Object.keys(allUsers).map(username => ({
                username,
                points: points[username] || 0,
                totalBet: totalBets[username] || 0
            })).sort((a, b) => b.points - a.points);
            
            let tableBodyHTML = '';
            if (playerList.length > 0) {
                playerList.forEach((player, index) => {
                    tableBodyHTML += `<tr>
                        <td>${index + 1}</td>
                        <td>${player.username}</td>
                        <td>${player.points}</td>
                        <td>${player.totalBet.toLocaleString('cs-CZ')}</td>
                    </tr>`;
                });
            } else {
                tableBodyHTML = '<tr><td colspan="4" class="text-center">Žádní hráči v žebříčku.</td></tr>';
            }

            document.getElementById('leaderboard-section').innerHTML = `
                <h2 class="mb-4"><i class="fas fa-trophy me-2"></i>Žebříček Hráčů</h2>
                <div class="card p-3"><div class="table-responsive"><table class="table table-hover">
                    <thead><tr><th>#</th><th>Hráč</th><th>Body</th><th>Celková sázka (Kč)</th></tr></thead>
                    <tbody>${tableBodyHTML}</tbody>
                </table></div></div>`;
        };
        
        const renderMatches = async () => {
            let html = `<h2 class="mb-4"><i class="fas fa-soccer-ball me-2"></i>Zápasy a Tipy</h2>`;
            if (allMatches.length === 0) {
                html += '<p class="text-center text-muted">Žádné zápasy k zobrazení.</p>';
                document.getElementById('matches-section').innerHTML = html;
                return;
            }

            const [tipsSnap, betsSnap, evalsSnap, resultsSnap] = await Promise.all([
                database.ref('tips').once('value'), database.ref('bets').once('value'),
                database.ref('evaluations').once('value'), database.ref('matchResults').once('value')
            ]);
            const allTips = tipsSnap.val() || {}, allBets = betsSnap.val() || {},
                  allEvals = evalsSnap.val() || {}, matchResults = resultsSnap.val() || {};

            allMatches.forEach(round => {
                html += `<h3 class="mt-4 mb-3">${round.round}</h3>`;
                round.matches.forEach(match => {
                    const officialResultText = matchResults[match.id] !== undefined ? `Výsledek: ${matchResults[match.id]}` : 'Čeká na vyhodnocení';
                    const isEvaluated = matchResults[match.id] !== undefined;

                    let playerRowsHTML = '';
                    Object.keys(allUsers).forEach(username => {
                        const tip = allTips[username]?.[match.id] ?? '';
                        const bet = allBets[username]?.[match.id] ?? '';
                        const evaluation = allEvals[username]?.[match.id] ?? 'nevyhodnoceno';
                        const isCurrentUser = username === currentPlayer;
                        
                        playerRowsHTML += `
                            <div class="player-tip-row">
                                <span><i class="fas fa-user me-2 opacity-75"></i>${username}</span>
                                <select class="form-select form-select-sm w-auto" onchange="saveTip('${match.id}', this.value)" ${!isCurrentUser || isEvaluated ? 'disabled' : ''}>
                                    <option value="" ${tip === '' ? 'selected' : ''}>Tip</option>
                                    <option value="1" ${tip === 1 ? 'selected' : ''}>1</option>
                                    <option value="0" ${tip === 0 ? 'selected' : ''}>0</option>
                                    <option value="2" ${tip === 2 ? 'selected' : ''}>2</option>
                                </select>
                                <input type="number" class="form-control form-control-sm w-auto" placeholder="Sázka" min="0" max="1000" step="10" value="${bet}" onchange="saveBet('${match.id}', this.value)" ${!isCurrentUser || isEvaluated ? 'disabled' : ''}>
                                <span class="evaluation-status-display status-${evaluation}">${evaluation.toUpperCase()}</span>
                            </div>`;
                    });
                    
                    html += `
                        <div class="card"><div class="card-body">
                            <div class="match-header">
                                <h5><i class="fas fa-futbol me-2"></i>${match.name}</h5>
                                <span class="match-score">${officialResultText}</span>
                            </div>
                            <div>${playerRowsHTML}</div>
                        </div></div>`;
                });
            });
            document.getElementById('matches-section').innerHTML = html;
        };

        const renderProfile = async () => {
            const profileSnap = await database.ref(`profiles/${currentPlayer}`).once('value');
            const account = profileSnap.val()?.account || '';
            document.getElementById('profile-section').innerHTML = `
                <h2 class="mb-4"><i class="fas fa-user me-2"></i>Můj Profil</h2>
                <div class="card p-4 mb-4">
                    <h3><i class="fas fa-address-card me-2"></i>Bankovní údaje</h3>
                    <div class="mb-3"><label for="my-account" class="form-label">Číslo účtu (formát XXXXXX-XXXXXXXXXX):</label><input type="text" class="form-control" id="my-account" value="${account}" placeholder="123456-7890123456" maxlength="24"></div>
                    <div class="mb-4"><label for="my-pin" class="form-label">Změna PIN (nový 4-místný PIN):</label><input type="password" class="form-control" id="my-pin" placeholder="••••" maxlength="4"></div>
                    <button class="btn btn-info" onclick="saveProfile()"><i class="fas fa-save me-1"></i>Uložit profil</button>
                </div>
                <div class="card p-4">
                    <h3><i class="fas fa-qrcode me-2"></i>QR kód pro výhru</h3>
                    <p class="text-muted">Generovat QR kód pro vyplacení výhry, pokud jsi vítěz měsíční soutěže.</p>
                    <button class="btn btn-primary" onclick="generateQR()"><i class="fas fa-qrcode me-1"></i>Generovat QR pro výhru</button>
                    <div id="qr-container" class="text-center mt-3 d-none">
                        <canvas id="qr-canvas"></canvas>
                        <p class="mt-2 text-muted small" id="qr-details"></p>
                    </div>
                </div>`;
        };
        
        const renderAdminPanel = async () => {
            const resultsSnap = await database.ref('matchResults').once('value');
            const matchResults = resultsSnap.val() || {};
            
            let unevaluatedMatchesHTML = '';
            allMatches.forEach(round => {
                round.matches.forEach(match => {
                    if (matchResults[match.id] === undefined) {
                        unevaluatedMatchesHTML += `
                            <div class="d-flex justify-content-between align-items-center mb-2 p-2 border rounded">
                                <span>${match.name}</span>
                                <div>
                                    <button class="btn btn-sm btn-success" onclick="adminEvaluateMatch('${match.id}', 1)">1</button>
                                    <button class="btn btn-sm btn-warning" onclick="adminEvaluateMatch('${match.id}', 0)">0</button>
                                    <button class="btn btn-sm btn-danger" onclick="adminEvaluateMatch('${match.id}', 2)">2</button>
                                </div>
                            </div>`;
                    }
                });
            });
            if (unevaluatedMatchesHTML === '') {
                unevaluatedMatchesHTML = '<p class="text-muted">Všechny zápasy jsou vyhodnoceny.</p>';
            }

            document.getElementById('admin-section').innerHTML = `
                <div class="admin-controls card p-4">
                    <h2 class="mb-4"><i class="fas fa-cogs me-2"></i>Administrace Soutěže</h2>
                    <div class="card p-4 mb-4">
                        <h3><i class="fas fa-check-double me-2"></i>Vyhodnocení zápasů</h3>
                        ${unevaluatedMatchesHTML}
                    </div>
                    <div class="card p-4">
                        <h3><i class="fas fa-redo-alt me-2"></i>Měsíční Reset</h3>
                        <p class="text-muted">Resetuje body, sázky a vyhodnocení pro novou měsíční soutěž. Tuto akci nelze vrátit!</p>
                        <button class="btn btn-danger" onclick="confirmReset()"><i class="fas fa-exclamation-triangle me-1"></i>Resetovat Soutěž</button>
                    </div>
                </div>`;
        };

        // --- USER ACTIONS ---
        const saveTip = (matchId, tip) => {
            const value = tip === "" ? null : parseInt(tip);
            database.ref(`tips/${currentPlayer}/${matchId}`).set(value)
                .then(() => showToast('Tip uložen!', 'success'))
                .catch(handleFirebaseError);
        };

        const saveBet = (matchId, bet) => {
            const value = bet === "" ? null : parseInt(bet);
            if (value !== null && (isNaN(value) || value < 0 || value > 1000)) {
                return showToast('Sázka musí být mezi 0 a 1000 Kč!', 'danger');
            }
            database.ref(`bets/${currentPlayer}/${matchId}`).set(value)
                .then(() => {
                    showToast('Sázka uložena!', 'success');
                    updateTotalBet(currentPlayer);
                })
                .catch(handleFirebaseError);
        };

        const updateTotalBet = (username) => {
            database.ref(`bets/${username}`).once('value', snapshot => {
                const totalBet = Object.values(snapshot.val() || {}).reduce((sum, b) => sum + (parseInt(b) || 0), 0);
                database.ref(`totalBets/${username}`).set(totalBet);
            }).catch(handleFirebaseError);
        };
        
        const saveProfile = () => {
            const account = document.getElementById('my-account').value.trim();
            const pin = document.getElementById('my-pin').value.trim();
            
            if (account && !/^\d{1,6}-\d{1,10}$/.test(account)) return showToast('Číslo účtu má neplatný formát!', 'danger');
            if (pin && !/^\d{4}$/.test(pin)) return showToast('PIN musí být 4 číslice!', 'danger');
            
            const updates = {};
            if (account) updates[`/profiles/${currentPlayer}/account`] = account;
            if (pin) updates[`/users/${currentPlayer}/pin`] = pin;
            
            if (Object.keys(updates).length > 0) {
                database.ref().update(updates)
                    .then(() => {
                        showToast('Profil uložen!', 'success');
                        if (pin) document.getElementById('my-pin').value = '';
                    })
                    .catch(handleFirebaseError);
            }
        };

        const generateQR = async () => { /* ... (stejná funkčnost jako v předchozí verzi) ... */ };

        // --- ADMIN ACTIONS ---
        const confirmReset = () => {
            if (confirm('Opravdu chcete resetovat celou měsíční soutěž? Tato akce je nevratná!')) {
                const pathsToRemove = ['points', 'totalBets', 'bets', 'tips', 'evaluations', 'matchResults'];
                const updates = {};
                pathsToRemove.forEach(path => updates[path] = null);
                database.ref().update(updates)
                    .then(() => showToast('Soutěž byla úspěšně resetována!', 'success'))
                    .catch(handleFirebaseError);
            }
        };

        const adminEvaluateMatch = async (matchId, result) => {
            await database.ref(`matchResults/${matchId}`).set(result);
            const tipsSnapshot = await database.ref('tips').once('value');
            const allTips = tipsSnapshot.val() || {};
            
            const updates = {};
            const pointUpdates = [];
            
            Object.keys(allUsers).forEach(username => {
                const userTip = allTips[username]?.[matchId];
                if (userTip !== undefined) {
                    if (parseInt(userTip) === result) {
                        updates[`/evaluations/${username}/${matchId}`] = 'ok';
                        pointUpdates.push(database.ref(`points/${username}`).transaction(points => (points || 0) + 3));
                    } else {
                        updates[`/evaluations/${username}/${matchId}`] = 'spatne';
                    }
                }
            });
            await database.ref().update(updates);
            await Promise.all(pointUpdates);
            showToast('Zápas úspěšně vyhodnocen a body připsány!', 'success');
        };

        // --- UTILITIES ---
        const setupNavigation = () => { /* ... (stejná funkčnost) ... */ };
        const showSection = (sectionId) => { /* ... (stejná funkčnost) ... */ };
        const toggleDarkMode = () => { /* ... (stejná funkčnost) ... */ };
        const showToast = (message, type = 'info') => { /* ... (stejná funkčnost) ... */ };
        const handleFirebaseError = (error) => { console.error("Firebase Error:", error); showToast(`Chyba databáze: ${error.message}`, 'danger'); };
        
        // --- On Page Load ---
        window.onload = () => { if (sessionStorage.getItem('currentPlayer')) initApp(); };
        
        // --- Implementace pomocných funkcí (zkráceno pro přehlednost)
        const setupNav = () => {
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => link.addEventListener('click', e => {
                e.preventDefault();
                navLinks.forEach(l => l.classList.remove('active'));
                e.target.classList.add('active');
                showSection(e.target.dataset.section);
            }));
        };
        const showSec = (sectionId) => {
            document.querySelectorAll('.app-section').forEach(s => s.classList.add('d-none'));
            document.getElementById(`${sectionId}-section`).classList.remove('d-none');
        };
        const toggleDM = () => {
            document.body.classList.toggle('light-mode');
            const icon = document.getElementById('dark-mode-icon');
            icon.className = document.body.classList.contains('light-mode') ? 'fas fa-sun' : 'fas fa-moon';
        };
        const showT = (message, type = 'info') => {
            const toastEl = document.getElementById('liveToast');
            const toastHeader = toastEl.querySelector('.toast-header');
            toastEl.querySelector('.toast-body').textContent = message;
            toastHeader.classList.remove('bg-success', 'bg-danger', 'bg-warning', 'bg-info', 'text-white');
            let bgClass = `bg-${type}`;
            if(type === 'success' || type === 'danger') toastHeader.classList.add('text-white');
            toastHeader.classList.add(bgClass);
            new bootstrap.Toast(toastEl).show();
        };

        // Re-assigning to keep onclick handlers working
        setupNavigation = setupNav;
        showSection = showSec;
        toggleDarkMode = toggleDM;
        showToast = showT;

    </script>
</body>
</html>
