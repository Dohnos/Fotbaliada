<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Fotbalové Tipy | Soutěž</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f7fc;
            --card-bg-color: #ffffff;
            --text-color: #333;
            --heading-color: #1a253c;
            --muted-text-color: #888;
            --border-color: #e9ecef;
            --accent-color: #007bff;
            --accent-color-dark: #0056b3;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --border-radius: 16px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --sidebar-width: 260px;
            --mobile-nav-height: 70px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
        }

        h1, h2, h3, h4, h5 { font-family: 'Oswald', sans-serif; font-weight: 700; color: var(--heading-color); }
        .lead { color: var(--muted-text-color); }

        /* --- Login Page --- */
        .login-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background-color: var(--bg-color); z-index: 2000;
        }
        .login-card {
            background: var(--card-bg-color); padding: 40px; border-radius: var(--border-radius);
            box-shadow: var(--shadow); max-width: 450px; width: 100%;
        }

        /* --- Main Layout & Navigation --- */
        .sidebar {
            width: var(--sidebar-width); height: 100vh;
            background-color: var(--card-bg-color);
            border-right: 1px solid var(--border-color);
            position: fixed; top: 0; left: 0;
            display: flex; flex-direction: column; padding: 2rem 1.5rem;
            transition: transform 0.3s ease;
        }
        .sidebar-header { margin-bottom: 2rem; }
        .sidebar-nav a {
            display: flex; align-items: center; padding: 0.9rem 1.2rem;
            color: var(--muted-text-color); font-weight: 500;
            text-decoration: none; border-radius: 12px; margin-bottom: 0.5rem;
            transition: all 0.2s ease-in-out;
        }
        .sidebar-nav a:hover { background-color: #f0f0f0; color: var(--heading-color); }
        .sidebar-nav a.active {
            background: var(--accent-color); color: #fff;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
        }
        .sidebar-nav a i { width: 30px; font-size: 1.1rem; }
        .sidebar-footer { margin-top: auto; }

        .mobile-nav { display: none; }

        .content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 2rem;
        }
        
        /* --- Responsive Navigation --- */
        @media (max-width: 992px) {
            .sidebar { transform: translateX(-100%); display: none; }
            .content { margin-left: 0; padding-bottom: var(--mobile-nav-height); }
            .mobile-nav {
                display: flex; justify-content: space-around; align-items: center;
                position: fixed; bottom: 0; left: 0; right: 0;
                height: var(--mobile-nav-height); background: var(--card-bg-color);
                box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05); z-index: 1000;
            }
            .mobile-nav a {
                flex: 1; text-align: center; color: var(--muted-text-color);
                text-decoration: none; transition: color 0.2s ease;
            }
            .mobile-nav a.active { color: var(--accent-color); }
            .mobile-nav a i { font-size: 1.5rem; }
        }

        /* --- Universal Components --- */
        .card {
            background-color: var(--card-bg-color); border: none;
            border-radius: var(--border-radius); box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }
        .form-control, .form-select {
            border-radius: 12px; padding: 12px 16px; border: 1px solid var(--border-color);
            background-color: var(--bg-color);
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--accent-color); box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
            background-color: var(--card-bg-color);
        }
        .btn {
            border-radius: 12px; padding: 12px 28px; font-weight: 500;
            transition: all 0.2s ease-in-out; border: none;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background-color: var(--accent-color); }
        .btn-primary:hover { background-color: var(--accent-color-dark); box-shadow: 0 7px 14px rgba(0, 123, 255, 0.2); }

        /* --- Specific Component Styles --- */
        .table { border-radius: var(--border-radius); overflow: hidden; }
        .table thead th { background-color: var(--bg-color); color: var(--heading-color); border: none; }
        .table td, .table th { border-color: var(--border-color) !important; color: var(--text-color); vertical-align: middle; }
        
        .match-header {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;
            margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;
        }
        .player-tip-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 10px; flex-wrap: wrap; }
        .player-tip-row .form-select, .player-tip-row .form-control { font-size: 0.9rem; padding: 8px 12px; }
        
        .evaluation-status-display { font-weight: bold; padding: 5px 12px; border-radius: 8px; font-size: 0.85em; }
        .status-ok { background-color: rgba(40, 167, 69, 0.1); color: var(--success-color); }
        .status-spatne { background-color: rgba(220, 53, 69, 0.1); color: var(--danger-color); }
        .status-nevyhodnoceno { background-color: #f0f0f0; color: var(--muted-text-color); }
        
        .admin-controls h2 { color: var(--danger-color); }
        .admin-controls .card { border: 1px solid rgba(220, 53, 69, 0.2); }

        .modal-content { border-radius: var(--border-radius); border: none; }
    </style>
</head>
<body>
    
    <!-- Login Page -->
    <div id="login-page" class="login-container">
        <div class="login-card text-center">
            <h1><i class="fa-solid fa-futbol" style="color: var(--accent-color);"></i> Fotbalové Tipy</h1>
            <p class="lead mb-4">Měsíční tipovací soutěž</p>
            <div class="mb-3">
                <input type="text" class="form-control" id="username" placeholder="Uživatelské jméno">
            </div>
            <div class="mb-4">
                <input type="password" class="form-control" id="pin" placeholder="PIN (4 číslice)" maxlength="4" inputmode="numeric">
            </div>
            <button class="btn btn-primary w-100 mb-2" onclick="login()">Přihlásit se <i class="fas fa-key"></i></button>
            <button class="btn btn-outline-secondary w-100" onclick="register()">Registrovat se <i class="fas fa-user-plus"></i></button>
        </div>
    </div>

    <!-- Main App Layout -->
    <div id="main-app" class="d-none w-100">
        <!-- Desktop Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fa-solid fa-futbol" style="color: var(--accent-color);"></i> Fotbalové Tipy</h3>
            </div>
            <nav class="sidebar-nav flex-grow-1">
                <a href="#" data-section="dashboard" class="active"><i class="fas fa-home"></i>Dashboard</a>
                <a href="#" data-section="matches"><i class="fas fa-soccer-ball"></i>Zápasy</a>
                <a href="#" data-section="leaderboard"><i class="fas fa-trophy"></i>Žebříček</a>
                <a href="#" data-section="profile"><i class="fas fa-user"></i>Můj Profil</a>
                <a href="#" data-section="admin" class="d-none" id="admin-nav-item" style="color: var(--danger-color);"><i class="fas fa-shield-alt"></i>Admin</a>
            </nav>
            <div class="sidebar-footer">
                 <div id="user-info" class="p-2 rounded" style="background: var(--bg-color);">
                     <small>Přihlášen jako</small>
                     <p class="fw-bold mb-0" id="logged-in-user"></p>
                 </div>
                <button class="btn btn-outline-secondary w-100 mt-3" onclick="logout()"><i class="fas fa-sign-out-alt me-1"></i>Odhlásit se</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <div class="container-fluid">
                <section id="dashboard-section" class="app-section"></section>
                <section id="matches-section" class="app-section d-none"></section>
                <section id="leaderboard-section" class="app-section d-none"></section>
                <section id="profile-section" class="app-section d-none"></section>
                <section id="admin-section" class="app-section d-none"></section>
            </div>
        </main>

        <!-- Mobile Bottom Navigation -->
        <nav class="mobile-nav">
            <a href="#" data-section="dashboard" class="active"><i class="fas fa-home"></i></a>
            <a href="#" data-section="matches"><i class="fas fa-soccer-ball"></i></a>
            <a href="#" data-section="leaderboard"><i class="fas fa-trophy"></i></a>
            <a href="#" data-section="profile"><i class="fas fa-user"></i></a>
        </nav>
    </div>

    <!-- Modals & Toasts -->
    <div class="modal fade" id="resetConfirmModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title">Opravdu resetovat soutěž?</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Tato akce je nevratná. Všechny body, sázky a vyhodnocení budou trvale smazány.</p>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Zrušit</button>
                    <button type="button" class="btn btn-danger" id="confirmResetBtn">Ano, resetovat</button>
                </div>
            </div>
        </div>
    </div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        // --- CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyB-gLlgyPKNf4z1cfl1Z1N1qu79FvO_3A8",
            authDomain: "ftbapp-ded2c.firebaseapp.com",
            databaseURL: "https://ftbapp-ded2c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "ftbapp-ded2c",
            storageBucket: "ftbapp-ded2c.appspot.com",
            messagingSenderId: "239337886217",
            appId: "1:239337886217:web:9b67dffaba23d6e86dded8"
        };
        const ADMIN_USERNAME = 'kuba';

        // --- GLOBAL STATE ---
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let currentPlayer = null;
        let allUsers = {};
        let allMatches = [];
        let resetModal;

        // --- AUTH & INIT ---
        const register = () => {
            const username = document.getElementById('username').value.trim().toLowerCase();
            const pin = document.getElementById('pin').value.trim();
            if (username.length < 3) return showToast('Jméno musí mít alespoň 3 znaky!', 'danger');
            if (!/^\d{4}$/.test(pin)) return showToast('PIN musí být 4 číslice!', 'danger');
            
            database.ref(`users/${username}`).once('value', snapshot => {
                if (snapshot.exists()) return showToast('Uživatel s tímto jménem již existuje!', 'danger');
                
                database.ref(`users/${username}`).set({ pin, registeredAt: new Date().toISOString() });
                sessionStorage.setItem('currentPlayer', username);
                showToast(`Registrace úspěšná, vítej ${username}! 🎉`, 'success');
                initApp();
            }).catch(handleFirebaseError);
        };

        const login = () => {
            const username = document.getElementById('username').value.trim().toLowerCase();
            const pin = document.getElementById('pin').value.trim();
            if (!username || !pin) return showToast('Zadejte jméno a PIN.', 'warning');

            database.ref(`users/${username}/pin`).once('value', snapshot => {
                if (snapshot.val() === pin) {
                    sessionStorage.setItem('currentPlayer', username);
                    initApp();
                } else {
                    showToast('Špatné jméno nebo PIN!', 'danger');
                }
            }).catch(handleFirebaseError);
        };

        const logout = () => { sessionStorage.removeItem('currentPlayer'); location.reload(); };

        const initApp = async () => {
            currentPlayer = sessionStorage.getItem('currentPlayer');
            if (!currentPlayer) return;

            document.getElementById('login-page').classList.add('d-none');
            document.getElementById('main-app').classList.remove('d-none');
            document.getElementById('logged-in-user').textContent = currentPlayer;
            
            if (currentPlayer === ADMIN_USERNAME) document.getElementById('admin-nav-item').classList.remove('d-none');
            
            setupNavigation();
            
            try {
                allMatches = await loadMatchesFromFile();
                setupFirebaseListeners();
                showSection('dashboard');
                resetModal = new bootstrap.Modal(document.getElementById('resetConfirmModal'));
            } catch (error) {
                showToast(error.message, 'danger');
                const errorHtml = `<div class="alert alert-danger"><strong>Chyba:</strong> ${error.message}</div>`;
                document.getElementById('dashboard-section').innerHTML = errorHtml;
            }
        };
        
        const setupFirebaseListeners = () => {
            database.ref('users').on('value', snapshot => {
                allUsers = snapshot.val() || {};
                renderAllSections();
            }, handleFirebaseError);
            database.ref('matchResults').on('value', () => renderAllSections(), handleFirebaseError);
        };

        const loadMatchesFromFile = async () => { /* ... Function remains the same, it's already robust ... */
            const response = await fetch('matches.txt');
            if (!response.ok) {
                if(response.status === 404) throw new Error('Soubor `matches.txt` nebyl nalezen. Ujistěte se, že existuje ve stejné složce jako `index.html`.');
                throw new Error(`Chyba při načítání souboru zápasů (HTTP status: ${response.status}).`);
            }
            const text = await response.text();
            if (!text.trim()) throw new Error('Soubor `matches.txt` je prázdný.');

            const lines = text.split('\n').filter(line => line.trim() !== '');
            
            let currentRound = 'Neznámé kolo';
            const rounds = [];
            let roundIndex = -1;

            lines.forEach(line => {
                const isRoundTitle = !line.toLowerCase().includes('vs.');
                if (isRoundTitle) {
                    currentRound = line.trim();
                    rounds.push({ round: currentRound, matches: [] });
                    roundIndex++;
                } else {
                    if (roundIndex === -1) {
                        rounds.push({ round: currentRound, matches: [] });
                        roundIndex = 0;
                    }
                    const matchIndex = rounds[roundIndex].matches.length;
                    rounds[roundIndex].matches.push({
                        id: `r${roundIndex}m${matchIndex}`,
                        name: line.trim()
                    });
                }
            });
            return rounds;
        };

        // --- RENDER FUNCTIONS ---
        const renderAllSections = () => {
            renderDashboard(); renderLeaderboard(); renderMatches(); renderProfile();
            if(currentPlayer === ADMIN_USERNAME) renderAdminPanel();
        };

        const renderDashboard = async () => { /* ... Function is good, just adapting to new CSS ... */
            const pointsSnap = await database.ref(`points/${currentPlayer}`).once('value');
            const betsSnap = await database.ref(`totalBets/${currentPlayer}`).once('value');
            const totalBetsSnap = await database.ref('totalBets').once('value');
            
            const myPoints = pointsSnap.val() || 0;
            const myBet = betsSnap.val() || 0;
            const totalPool = Object.values(totalBetsSnap.val() || {}).reduce((sum, bet) => sum + bet, 0);

            document.getElementById('dashboard-section').innerHTML = `
                <h2 class="mb-4">Dashboard</h2>
                <div class="row">
                    <div class="col-lg-8 mb-4">
                        <div class="card p-4">
                            <h3><i class="fas fa-user-circle me-2 text-primary"></i>Můj stav</h3>
                            <div class="d-flex justify-content-around text-center mt-3">
                                <div><p class="fs-2 fw-bold mb-1">${myPoints}</p><small class="text-muted">BODŮ</small></div>
                                <div><p class="fs-2 fw-bold mb-1">${myBet.toLocaleString('cs-CZ')}</p><small class="text-muted">VSAZENO (KČ)</small></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4 mb-4">
                         <div class="card p-4 bg-primary text-white">
                            <h3><i class="fas fa-coins me-2"></i>Celkový bank</h3>
                            <p class="fs-2 fw-bold mb-0">${totalPool.toLocaleString('cs-CZ')} Kč</p>
                        </div>
                    </div>
                </div>
                <div class="card p-4"><h3><i class="fa-solid fa-fire text-warning"></i>Nadcházející zápasy</h3><p class="text-muted">Brzy zde uvidíte přehled nadcházejících zápasů...</p></div>
            `;
        };

        const renderLeaderboard = async () => { /* ... Function is good, just adapting to new CSS ... */
             const pointsSnap = await database.ref('points').once('value');
            const betsSnap = await database.ref('totalBets').once('value');
            const points = pointsSnap.val() || {};
            const totalBets = betsSnap.val() || {};

            const playerList = Object.keys(allUsers).map(username => ({
                username,
                points: points[username] || 0,
                totalBet: totalBets[username] || 0
            })).sort((a, b) => b.points - a.points || b.totalBet - a.totalBet);
            
            let tableBodyHTML = '';
            if (playerList.length > 0) {
                playerList.forEach((player, index) => {
                    const highlightClass = player.username === currentPlayer ? 'table-primary' : '';
                    tableBodyHTML += `<tr class="${highlightClass}">
                        <td class="fw-bold">${index + 1}</td>
                        <td>${player.username}</td>
                        <td>${player.points}</td>
                        <td>${player.totalBet.toLocaleString('cs-CZ')} Kč</td>
                    </tr>`;
                });
            } else {
                tableBodyHTML = '<tr><td colspan="4" class="text-center p-4">Žádní hráči v žebříčku.</td></tr>';
            }

            document.getElementById('leaderboard-section').innerHTML = `
                <h2 class="mb-4">Žebříček hráčů</h2>
                <div class="card"><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0">
                    <thead><tr><th>#</th><th>Hráč</th><th>Body</th><th>Celková sázka</th></tr></thead>
                    <tbody>${tableBodyHTML}</tbody>
                </table></div></div></div>`;
        };
        
        const renderMatches = async () => { /* ... Function is good, just adapting to new CSS ... */
            let html = `<h2 class="mb-4">Zápasy a tipy</h2>`;
            if (allMatches.length === 0) {
                html += '<div class="card card-body text-center"><p class="mb-0 text-muted">Žádné zápasy k zobrazení.</p></div>';
                document.getElementById('matches-section').innerHTML = html;
                return;
            }

            const [tipsSnap, betsSnap, evalsSnap, resultsSnap] = await Promise.all([
                database.ref('tips').once('value'), database.ref('bets').once('value'),
                database.ref('evaluations').once('value'), database.ref('matchResults').once('value')
            ]);
            const allTips = tipsSnap.val() || {}, allBets = betsSnap.val() || {},
                  allEvals = evalsSnap.val() || {}, matchResults = resultsSnap.val() || {};

            allMatches.forEach(round => {
                html += `<h3 class="mt-4 mb-3">${round.round}</h3>`;
                round.matches.forEach(match => {
                    const officialResult = matchResults[match.id];
                    const officialResultText = officialResult !== undefined ? `Výsledek: ${officialResult}` : 'Čeká na vyhodnocení';
                    const isEvaluated = officialResult !== undefined;

                    let playerRowsHTML = '';
                    Object.keys(allUsers).forEach(username => {
                        const tip = allTips[username]?.[match.id];
                        const bet = allBets[username]?.[match.id] ?? '';
                        const evaluation = allEvals[username]?.[match.id] ?? 'nevyhodnoceno';
                        const isCurrentUser = username === currentPlayer;
                        
                        playerRowsHTML += `
                            <div class="player-tip-row p-2 rounded" style="background: ${isCurrentUser ? 'rgba(0,123,255,0.05)' : 'transparent'}">
                                <span><i class="fas fa-user me-2 opacity-50"></i>${username}</span>
                                <select class="form-select" onchange="saveTip('${match.id}', this.value)" ${!isCurrentUser || isEvaluated ? 'disabled' : ''}>
                                    <option value="" ${tip === undefined ? 'selected' : ''}>Tip</option>
                                    <option value="1" ${tip === 1 ? 'selected' : ''}>1</option>
                                    <option value="0" ${tip === 0 ? 'selected' : ''}>0</option>
                                    <option value="2" ${tip === 2 ? 'selected' : ''}>2</option>
                                </select>
                                <input type="number" class="form-control" style="width: 120px;" placeholder="Sázka" min="0" max="1000" step="10" value="${bet}" onchange="saveBet('${match.id}', this.value)" ${!isCurrentUser || isEvaluated ? 'disabled' : ''}>
                                <span class="evaluation-status-display status-${evaluation}">${evaluation.toUpperCase()}</span>
                            </div>`;
                    });
                    
                    html += `
                        <div class="card"><div class="card-body">
                            <div class="match-header">
                                <h5><i class="fas fa-futbol me-2"></i>${match.name}</h5>
                                <span class="badge bg-primary-subtle text-primary-emphasis rounded-pill p-2">${officialResultText}</span>
                            </div>
                            <div class="mt-3">${playerRowsHTML}</div>
                        </div></div>`;
                });
            });
            document.getElementById('matches-section').innerHTML = html;
        };

        const renderProfile = async () => { /* ... Function is good, just adapting to new CSS ... */ 
            const profileSnap = await database.ref(`profiles/${currentPlayer}`).once('value');
            const account = profileSnap.val()?.account || '';
            document.getElementById('profile-section').innerHTML = `
                <h2 class="mb-4">Můj profil</h2>
                <div class="row">
                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-body p-4">
                                <h3><i class="fas fa-address-card me-2"></i>Bankovní údaje</h3>
                                <div class="mb-3"><label for="my-account" class="form-label">Číslo účtu (formát XXXXXX-XXXXXXXXXX):</label><input type="text" class="form-control" id="my-account" value="${account}" placeholder="123456-7890123456" maxlength="24"></div>
                                <div class="mb-3"><label for="my-pin" class="form-label">Změna PIN (nový 4-místný PIN):</label><input type="password" class="form-control" id="my-pin" placeholder="••••" maxlength="4"></div>
                                <button class="btn btn-primary" onclick="saveProfile()"><i class="fas fa-save me-1"></i>Uložit profil</button>
                            </div>
                        </div>
                    </div>
                     <div class="col-lg-6">
                        <div class="card">
                            <div class="card-body p-4">
                                <h3><i class="fas fa-qrcode me-2"></i>QR kód pro výhru</h3>
                                <p class="text-muted">Generovat QR kód pro vyplacení výhry, pokud jsi vítěz měsíční soutěže.</p>
                                <button class="btn btn-primary" onclick="generateQR()"><i class="fas fa-qrcode me-1"></i>Generovat QR</button>
                                <div id="qr-container" class="text-center mt-3 d-none">
                                    <canvas id="qr-canvas"></canvas>
                                    <p class="mt-2 text-muted small" id="qr-details"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
        };
        
        const renderAdminPanel = async () => { /* ... Adapting to new CSS and Modal ... */ 
            const resultsSnap = await database.ref('matchResults').once('value');
            const matchResults = resultsSnap.val() || {};
            
            let unevaluatedMatchesHTML = '';
            allMatches.forEach(round => {
                round.matches.forEach(match => {
                    if (matchResults[match.id] === undefined) {
                        unevaluatedMatchesHTML += `
                            <div class="d-flex justify-content-between align-items-center mb-2 p-2 border rounded flex-wrap">
                                <span class="me-3">${match.name}</span>
                                <div class="btn-group">
                                    <button class="btn btn-sm btn-success" onclick="adminEvaluateMatch('${match.id}', 1)">1</button>
                                    <button class="btn btn-sm btn-warning text-dark" onclick="adminEvaluateMatch('${match.id}', 0)">0</button>
                                    <button class="btn btn-sm btn-danger" onclick="adminEvaluateMatch('${match.id}', 2)">2</button>
                                </div>
                            </div>`;
                    }
                });
            });
            if (unevaluatedMatchesHTML === '') {
                unevaluatedMatchesHTML = '<p class="text-muted">Všechny zápasy jsou vyhodnoceny.</p>';
            }

            document.getElementById('admin-section').innerHTML = `
                <div class="admin-controls card p-4">
                    <h2 class="mb-4"><i class="fas fa-cogs me-2"></i>Administrace</h2>
                    <div class="card mb-4"><div class="card-body p-4">
                        <h3><i class="fas fa-check-double me-2"></i>Vyhodnocení zápasů</h3>
                        ${unevaluatedMatchesHTML}
                    </div></div>
                    <div class="card"><div class="card-body p-4">
                        <h3><i class="fas fa-redo-alt me-2"></i>Měsíční Reset</h3>
                        <p class="text-muted">Resetuje body, sázky a vyhodnocení. Tuto akci nelze vrátit!</p>
                        <button class="btn btn-danger" onclick="showResetModal()"><i class="fas fa-exclamation-triangle me-1"></i>Resetovat Soutěž</button>
                    </div></div>
                </div>`;
        };

        // --- USER & ADMIN ACTIONS ---
        const saveTip = (matchId, tip) => { /* ... No change ... */
            const value = tip === "" ? null : parseInt(tip);
            database.ref(`tips/${currentPlayer}/${matchId}`).set(value)
                .then(() => showToast('Tip uložen!', 'success'))
                .catch(handleFirebaseError);
         };
        const saveBet = (matchId, bet) => { /* ... No change ... */ 
            const value = bet === "" ? null : parseInt(bet);
            if (value !== null && (isNaN(value) || value < 0 || value > 1000)) {
                return showToast('Sázka musí být mezi 0 a 1000 Kč!', 'danger');
            }
            database.ref(`bets/${currentPlayer}/${matchId}`).set(value)
                .then(() => {
                    showToast('Sázka uložena!', 'success');
                    updateTotalBet(currentPlayer);
                })
                .catch(handleFirebaseError);
        };
        const updateTotalBet = (username) => { /* ... No change ... */ 
            database.ref(`bets/${username}`).once('value', snapshot => {
                const totalBet = Object.values(snapshot.val() || {}).reduce((sum, b) => sum + (parseInt(b) || 0), 0);
                database.ref(`totalBets/${username}`).set(totalBet);
            }).catch(handleFirebaseError);
        };
        const saveProfile = () => { /* ... No change ... */ 
            const account = document.getElementById('my-account').value.trim();
            const pin = document.getElementById('my-pin').value.trim();
            
            if (account && !/^\d{1,6}-\d{1,10}$/.test(account)) return showToast('Číslo účtu má neplatný formát!', 'danger');
            if (pin && !/^\d{4}$/.test(pin)) return showToast('PIN musí být 4 číslice!', 'danger');
            
            const updates = {};
            if (account) updates[`/profiles/${currentPlayer}/account`] = account;
            if (pin) updates[`/users/${currentPlayer}/pin`] = pin;
            
            if (Object.keys(updates).length > 0) {
                database.ref().update(updates)
                    .then(() => {
                        showToast('Profil uložen!', 'success');
                        if (pin) document.getElementById('my-pin').value = '';
                    })
                    .catch(handleFirebaseError);
            } else {
                showToast('Nebyly provedeny žádné změny.', 'info');
            }
        };
        const generateQR = async () => { /* ... No change ... */ 
            const pointsSnap = await database.ref('points').once('value');
             const totalBetsSnap = await database.ref('totalBets').once('value');
             const points = pointsSnap.val() || {};
             const totalBets = totalBetsSnap.val() || {};

             if (Object.keys(points).length === 0) return showToast('Soutěž ještě nezačala.', 'info');

             let maxPoints = -1;
             Object.values(points).forEach(score => { if (score > maxPoints) maxPoints = score; });
             if(maxPoints <= 0) return showToast('Nikdo zatím nezískal body.', 'info');

             const winners = Object.keys(points).filter(user => points[user] === maxPoints);

             if (!winners.includes(currentPlayer)) return showToast('Nejsi vítěz, QR nelze generovat!', 'danger');

             const totalPool = Object.values(totalBets).reduce((sum, bet) => sum + bet, 0);
             const winnings = winners.length > 0 ? totalPool / winners.length : 0;
             if (winnings <= 0) return showToast('Výhra je 0 Kč, QR nelze generovat.', 'info');

             const accountSnap = await database.ref(`profiles/${currentPlayer}/account`).once('value');
             const account = accountSnap.val();
             if (!account) return showToast('Nejprve zadejte číslo účtu v profilu!', 'danger');

             const qrContainer = document.getElementById('qr-container');
             const canvas = document.getElementById('qr-canvas');
             const paymentDetails = `SPD*1.0*ACC:${account.replace('-', '')}*AM:${winnings.toFixed(2)}*CC:CZK*MSG:Vyhra FTB Tipy`;

             QRCode.toCanvas(canvas, paymentDetails, { width: 200, margin: 1 }, error => {
                 if (error) return handleFirebaseError(error);
                 document.getElementById('qr-details').textContent = `Platba ${winnings.toFixed(2)} Kč na účet ${account}`;
                 qrContainer.classList.remove('d-none');
                 showToast('QR kód úspěšně vygenerován!', 'success');
             });
        };
        
        const showResetModal = () => resetModal.show();
        const confirmReset = () => {
            const pathsToRemove = ['points', 'totalBets', 'bets', 'tips', 'evaluations', 'matchResults'];
            const updates = {};
            pathsToRemove.forEach(path => updates[path] = null);
            database.ref().update(updates)
                .then(() => {
                    resetModal.hide();
                    showToast('Soutěž byla úspěšně resetována!', 'success');
                })
                .catch(handleFirebaseError);
        };
        document.getElementById('confirmResetBtn').addEventListener('click', confirmReset);

        const adminEvaluateMatch = async (matchId, result) => { /* ... No change, logic is solid ... */ 
            await database.ref(`matchResults/${matchId}`).set(result);
            const tipsSnapshot = await database.ref('tips').once('value');
            const allTips = tipsSnapshot.val() || {};
            
            const updates = {};
            const pointPromises = Object.keys(allUsers).map(username => {
                const userTip = allTips[username]?.[matchId];
                if (userTip !== undefined) {
                    if (parseInt(userTip) === result) {
                        updates[`/evaluations/${username}/${matchId}`] = 'ok';
                        return database.ref(`points/${username}`).transaction(points => (points || 0) + 3);
                    } else {
                        updates[`/evaluations/${username}/${matchId}`] = 'spatne';
                    }
                }
                return Promise.resolve();
            });
            
            await database.ref().update(updates);
            await Promise.all(pointPromises);
            showToast('Zápas úspěšně vyhodnocen a body připsány!', 'success');
        };

        // --- UTILITY FUNCTIONS ---
        const setupNavigation = () => {
            const navLinks = document.querySelectorAll('.sidebar-nav a, .mobile-nav a');
            navLinks.forEach(link => link.addEventListener('click', e => {
                e.preventDefault();
                const section = e.currentTarget.dataset.section;
                showSection(section);
                
                navLinks.forEach(l => l.classList.remove('active'));
                document.querySelectorAll(`a[data-section="${section}"]`).forEach(l => l.classList.add('active'));
            }));
        };

        const showSection = (sectionId) => {
            document.querySelectorAll('.app-section').forEach(s => s.classList.add('d-none'));
            document.getElementById(`${sectionId}-section`).classList.remove('d-none');
        };

        const showToast = (message, type = 'info') => {
            const toastContainer = document.querySelector('.toast-container');
            const toastId = `toast-${Date.now()}`;
            const toastHTML = `
                <div id="${toastId}" class="toast align-items-center text-bg-${type} border-0" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex">
                        <div class="toast-body">${message}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>`;
            toastContainer.insertAdjacentHTML('beforeend', toastHTML);
            const toastEl = document.getElementById(toastId);
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
            toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
        };

        const handleFirebaseError = (error) => { console.error("Firebase Error:", error); showToast(`Chyba databáze: ${error.message}`, 'danger'); };
        
        // --- ON PAGE LOAD ---
        window.onload = () => { if (sessionStorage.getItem('currentPlayer')) initApp(); };
    </script>
</body>
</html>
