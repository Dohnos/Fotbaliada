<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Fotbalové tipy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.0/build/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
        }
        body.light-mode {
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            color: #333333;
        }
        .container {
            max-width: 900px;
        }
        h1, h2, h3, h4, h5 {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            color: #ffffff;
        }
        body.light-mode h1, body.light-mode h2, body.light-mode h3, body.light-mode h4, body.light-mode h5 {
            color: #0f0f23;
        }
        .login-container {
            text-align: center;
            margin-top: 100px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        body.light-mode .login-container {
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        .round-title {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            color: #ffffff;
            padding: 20px;
            margin: 20px 0;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body.light-mode .round-title {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.02));
            color: #0f0f23;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .tip-input, .bet-input, .account-input, .pin-input {
            width: 70px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 8px;
            margin-right: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        body.light-mode .tip-input, body.light-mode .bet-input, body.light-mode .account-input, body.light-mode .pin-input {
            background: rgba(255, 255, 255, 0.9);
            color: #333333;
            border: 2px solid rgba(0, 0, 0, 0.1);
        }
        .tip-input:focus, .bet-input:focus, .account-input:focus, .pin-input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.3);
            transform: scale(1.05);
        }
        body.light-mode .tip-input:focus, body.light-mode .bet-input:focus, body.light-mode .account-input:focus, body.light-mode .pin-input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.2);
        }
        .table {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body.light-mode .table {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .table th {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #ffffff;
        }
        .table td {
            background: transparent;
            color: #ffffff;
        }
        body.light-mode .table td {
            color: #333333;
        }
        .btn {
            border-radius: 25px;
            padding: 10px 25px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            color: #ffffff;
            border: none;
            font-family: 'Inter', sans-serif;
        }
        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); }
        .btn-success { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .btn-danger { background: linear-gradient(135deg, #fa709a, #fee140); }
        .btn-warning { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .btn-info { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .btn-secondary { background: linear-gradient(135deg, #fa709a, #fee140); }
        .btn-dark-mode, .btn-sign-out {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            border-radius: 50px;
        }
        .btn-sign-out { right: 120px; }
        .toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 1050;
        }
        .toast {
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            backdrop-filter: blur(10px);
        }
        body.light-mode .toast {
            background: rgba(255, 255, 255, 0.9);
            color: #333333;
        }
        .qr-code {
            margin-top: 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body.light-mode .qr-code {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .profile-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body.light-mode .profile-section {
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            color: #ffffff;
            margin-bottom: 20px;
        }
        body.light-mode .card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.05);
            color: #333333;
        }
        .card-body {
            background: transparent;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }
        body.light-mode .form-control {
            background: rgba(255, 255, 255, 0.9);
            color: #333333;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        .form-label {
            font-weight: 500;
        }
        .match-tips-table {
            margin-top: 10px;
        }
        .match-tips-table th, .match-tips-table td {
            vertical-align: middle;
        }
        .evaluation-btn {
            margin-left: 10px;
            padding: 5px 10px;
            font-size: 0.8rem;
        }
        .evaluation-status {
            margin-left: 10px;
            font-weight: bold;
        }
        #qr-container {
            display: none;
        }
        @media (max-width: 576px) {
            .tip-input, .bet-input, .account-input, .pin-input {
                width: 100%;
                margin-bottom: 10px;
            }
            .btn {
                padding: 8px 15px;
                font-size: 0.9rem;
                width: 100%;
            }
            .row > div {
                margin-bottom: 15px;
            }
            .evaluation-btn {
                margin-top: 5px;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Úvodní login stránka -->
    <div id="login-page" class="container login-container">
        <h1>⚽ Vítejte ve Fotbalových tipech! 🔑</h1>
        <p>Zadejte jméno a PIN pro přihlášení nebo registraci.</p>
        <div class="mb-3">
            <input type="text" class="form-control tip-input mx-auto d-block" id="username" placeholder="Jméno" style="width: 200px;">
        </div>
        <div class="mb-3">
            <input type="password" class="form-control tip-input mx-auto d-block" id="pin" placeholder="PIN (4 číslice)" maxlength="4" style="width: 200px;">
        </div>
        <button class="btn btn-primary" onclick="login()">Přihlásit se 🔐</button>
        <button class="btn btn-success mt-2" onclick="register()">Registrovat se 📝</button>
    </div>

    <!-- Hlavní obsah (skrýt po načtení) -->
    <div id="main-content" class="container mt-5" style="display: none;">
        <h1 class="mb-4">⚽ Fotbalové tipy 🏆</h1>
        <button class="btn btn-secondary btn-dark-mode" onclick="toggleDarkMode()">🌙 Režim</button>
        <button class="btn btn-danger btn-sign-out" onclick="logout()">Odhlásit se 🚪</button>

        <h2>🏆 Tabulka hráčů 💰</h2>
        <table class="table" id="player-table">
            <thead>
                <tr>
                    <th>Hráč</th>
                    <th>Body</th>
                    <th>Celková sázka (Kč)</th>
                </tr>
            </thead>
            <tbody id="player-table-body"></tbody>
        </table>
        <button class="btn btn-warning mb-4" onclick="resetPoints()">Reset bodů a sázek 🔄</button>

        <!-- Sekce pro profil (pouze pro aktuálního uživatele) -->
        <div class="profile-section">
            <h3>👤 Můj profil - Bankovní údaje 💳</h3>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Číslo účtu: </label>
                    <input type="text" class="account-input form-control" id="my-account" placeholder="123456-7890123456" maxlength="24">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Změna PIN: </label>
                    <input type="password" class="pin-input form-control" id="my-pin" placeholder="Nový PIN" maxlength="4">
                </div>
            </div>
            <button class="btn btn-info" onclick="saveProfile()">Uložit profil ✅</button>
            <button class="btn btn-primary ms-2" onclick="generateQR()">Generovat QR pro výhru 📱</button>
            <div id="qr-container" class="qr-code"></div>
        </div>

        <h2>⚽ Zápasy a tipy 🎯</h2>
        <div id="matches-container"></div>
    </div>

    <div class="toast-container">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-body"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        // Firebase konfigurace
        const firebaseConfig = {
            apiKey: "AIzaSyB-gLlgyPKNf4z1cfl1Z1N1qu79FvO_3A8",
            authDomain: "ftbapp-ded2c.firebaseapp.com",
            databaseURL: "https://ftbapp-ded2c-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "ftbapp-ded2c",
            storageBucket: "ftbapp-ded2c.firebasestorage.app",
            messagingSenderId: "239337886217",
            appId: "1:239337886217:web:9b67dffaba23d6e86dded8"
        };

        // Inicializace Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Funkce pro registraci
        function register() {
            const username = document.getElementById('username').value.trim().toLowerCase();
            const pin = document.getElementById('pin').value.trim();
            if (!username || username.length < 3) {
                showToast('Jméno musí mít alespoň 3 znaky! 😞');
                return;
            }
            if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {
                showToast('PIN musí být 4 číslice! 🔢');
                return;
            }

            // Ověřit, zda uživatel neexistuje
            database.ref(`users/${username}`).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    showToast('Uživatel s tímto jménem již existuje! 😞');
                } else {
                    database.ref(`users/${username}`).set({ pin: pin });
                    sessionStorage.setItem('currentPlayer', username);
                    document.getElementById('login-page').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                    init();
                    showToast(`Registrace úspěšná, vítej ${username}! 🎉`);
                }
            });
        }

        // Funkce pro přihlášení
        function login() {
            const username = document.getElementById('username').value.trim().toLowerCase();
            const pin = document.getElementById('pin').value.trim();
            if (!username || username.length < 3) {
                showToast('Jméno musí mít alespoň 3 znaky! 😞');
                return;
            }
            if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {
                showToast('PIN musí být 4 číslice! 🔢');
                return;
            }

            database.ref(`users/${username}/pin`).once('value', (snapshot) => {
                const storedPin = snapshot.val();
                if (storedPin === pin) {
                    sessionStorage.setItem('currentPlayer', username);
                    document.getElementById('login-page').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                    init();
                    showToast(`Vítej, ${username}! 🎉`);
                } else {
                    showToast('Špatný PIN nebo uživatel neexistuje! 🔒');
                }
            });
        }

        // Funkce pro odhlášení
        function logout() {
            sessionStorage.removeItem('currentPlayer');
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('login-page').style.display = 'block';
            document.getElementById('username').value = '';
            document.getElementById('pin').value = '';
            showToast('Odhlášení úspěšné. 👋');
        }

        // Funkce pro uložení profilu (účet a PIN)
        function saveProfile() {
            const username = sessionStorage.getItem('currentPlayer');
            const account = document.getElementById('my-account').value.trim();
            const pin = document.getElementById('my-pin').value.trim();

            if (account && !/^\d{6}-\d{10}$/.test(account)) {
                showToast('Číslo účtu musí být ve formátu XXXXXX-XXXXXXXXXX! 💳');
                return;
            }
            if (pin && (pin.length !== 4 || !/^\d{4}$/.test(pin))) {
                showToast('PIN musí být 4 číslice! 🔢');
                return;
            }

            if (account) {
                database.ref(`profiles/${username}/account`).set(account);
            }
            if (pin) {
                database.ref(`users/${username}/pin`).set(pin);
                document.getElementById('my-pin').value = '';
            }
            showToast('Profil uložen! ✅');
        }

        // Funkce pro zobrazení notifikace
        function showToast(message) {
            const toastEl = document.getElementById('toast');
            toastEl.querySelector('.toast-body').textContent = message;
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }

        // Funkce pro přepínání režimu (tmavý/světlý)
        function toggleDarkMode() {
            document.body.classList.toggle('light-mode');
        }

        // Funkce pro načtení zápasů ze souboru
        async function loadMatches() {
            try {
                const response = await fetch('matches.txt');
                if (!response.ok) throw new Error('Nepodařilo se načíst zápasy');
                const text = await response.text();
                const lines = text.split('\n').filter(line => line.trim() !== '');
                
                let currentRound = '';
                let matches = [];
                let rounds = [];

                lines.forEach(line => {
                    if (line.includes('. KOLO')) {
                        if (currentRound !== '') {
                            rounds.push({ round: currentRound, matches: matches });
                        }
                        currentRound = line.trim();
                        matches = [];
                    } else {
                        matches.push(line.trim());
                    }
                });

                if (matches.length > 0) {
                    rounds.push({ round: currentRound, matches: matches });
                }

                return rounds;
            } catch (error) {
                showToast('Chyba při načítání zápasů: ' + error.message);
                return [];
            }
        }

        // Funkce pro vykreslení tabulky hráčů
        function renderPlayerTable(users) {
            const tableBody = document.getElementById('player-table-body');
            tableBody.innerHTML = '';
            Object.keys(users).forEach(username => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${username}</td>
                    <td id="points-${username}">0</td>
                    <td id="bet-${username}">0</td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Funkce pro vykreslení zápasů a tipů
        function renderMatches(rounds, users, currentPlayer) {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';
            rounds.forEach((round, roundIndex) => {
                const roundElement = document.createElement('div');
                roundElement.className = 'card';
                roundElement.innerHTML = `
                    <div class="round-title">${round.round} ⚽</div>
                    <div class="card-body"></div>
                `;
                
                round.matches.forEach((match, matchIndex) => {
                    const matchDiv = document.createElement('div');
                    matchDiv.className = 'card mb-3';
                    matchDiv.innerHTML = `
                        <div class="card-body">
                            <h5 class="card-title">⚽ ${match}</h5>
                            <table class="table table-sm match-tips-table">
                                <thead>
                                    <tr>
                                        <th>Hráč</th>
                                        <th>Tip</th>
                                        <th>Sázka (Kč)</th>
                                        <th>Vyhodnocení</th>
                                    </tr>
                                </thead>
                                <tbody id="tips-body-${roundIndex}-${matchIndex}"></tbody>
                            </table>
                        </div>
                    `;
                    roundElement.querySelector('.card-body').appendChild(matchDiv);

                    // Vykreslení řádků pro hráče
                    const tipsBody = matchDiv.querySelector(`#tips-body-${roundIndex}-${matchIndex}`);
                    Object.keys(users).forEach(username => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${username}</td>
                            <td>
                                <input type="number" class="tip-input" id="${username}-tip-${roundIndex}-${matchIndex}" min="0" max="2" step="1" placeholder="Tip" onchange="saveTip('${username}', ${roundIndex}, ${matchIndex}, this.value)" ${username !== currentPlayer ? 'disabled' : ''}>
                            </td>
                            <td>
                                <input type="number" class="bet-input" id="${username}-bet-${roundIndex}-${matchIndex}" min="0" max="1000" step="10" placeholder="Sázka 💰" onchange="saveBet('${username}', ${roundIndex}, ${matchIndex}, this.value)" ${username !== currentPlayer ? 'disabled' : ''}>
                            </td>
                            <td id="${username}-eval-${roundIndex}-${matchIndex}"></td>
                        `;
                        tipsBody.appendChild(row);
                    });
                });
                container.appendChild(roundElement);
            });
        }

        // Funkce pro uložení tipu do Firebase
        function saveTip(username, roundIndex, matchIndex, tip) {
            const value = parseInt(tip);
            if (isNaN(value) || value < 0 || value > 2) {
                showToast('Tip musí být číslo mezi 0 a 2! 🎯');
                document.getElementById(`${username}-tip-${roundIndex}-${matchIndex}`).value = '';
                return;
            }
            database.ref(`tips/${username}/${roundIndex}/${matchIndex}`).set(value);
            showToast(`Tip pro ${username} uložen! ✅`);
        }

        // Funkce pro uložení sázky do Firebase
        function saveBet(username, roundIndex, matchIndex, bet) {
            const value = parseInt(bet);
            if (isNaN(value) || value < 0 || value > 1000) {
                showToast('Sázka musí být číslo mezi 0 a 1000 Kč! 💰');
                document.getElementById(`${username}-bet-${roundIndex}-${matchIndex}`).value = '';
                return;
            }
            database.ref(`bets/${username}/${roundIndex}/${matchIndex}`).set(value);
            updateTotalBet(username);
            showToast(`Sázka pro ${username} uložena! 💸`);
        }

        // Funkce pro vyhodnocení tipu uživatelem (jen svého)
        function evaluateTip(username, roundIndex, matchIndex, status) {
            if (username !== sessionStorage.getItem('currentPlayer')) {
                showToast('Můžeš vyhodnotit jen svůj tip! 🔒');
                return;
            }
            database.ref(`evaluations/${username}/${roundIndex}/${matchIndex}`).once('value', (snap) => {
                if (snap.val()) {
                    showToast('Tip již vyhodnocen! ⚠️');
                    return;
                }
                database.ref(`evaluations/${username}/${roundIndex}/${matchIndex}`).set(status);
                if (status === 'ok') {
                    updatePoints(username, 3);
                }
                showToast(`Tip vyhodnocen jako ${status === 'ok' ? 'OK' : 'ŠPATNĚ'}! ${status === 'ok' ? '🎉' : '😞'}`);
            });
        }

        // Funkce pro aktualizaci celkové sázky
        function updateTotalBet(username) {
            database.ref(`bets/${username}`).once('value', (snapshot) => {
                let totalBet = 0;
                const bets = snapshot.val();
                if (bets) {
                    for (const round in bets) {
                        for (const match in bets[round]) {
                            totalBet += parseInt(bets[round][match]) || 0;
                        }
                    }
                }
                document.getElementById(`bet-${username}`).textContent = totalBet;
                database.ref(`totalBets/${username}`).set(totalBet);
            });
        }

        // Funkce pro aktualizaci bodů
        function updatePoints(username, points) {
            database.ref(`points/${username}`).once('value', (snap) => {
                const currentPoints = snap.val() || 0;
                const newPoints = currentPoints + points;
                database.ref(`points/${username}`).set(newPoints);
            });
        }

        // Funkce pro generování QR v profilu
        function generateQR() {
            const username = sessionStorage.getItem('currentPlayer');
            database.ref('points').once('value', (pointsSnap) => {
                const points = pointsSnap.val() || {};
                let maxPoints = -1;
                let winners = [];
                Object.keys(points).forEach(user => {
                    const userPoints = points[user] || 0;
                    if (userPoints > maxPoints) {
                        maxPoints = userPoints;
                        winners = [user];
                    } else if (userPoints === maxPoints) {
                        winners.push(user);
                    }
                });

                if (!winners.includes(username)) {
                    showToast('Nejsi vítěz, QR nelze generovat! 😞');
                    return;
                }

                database.ref('totalBets').once('value', (betsSnap) => {
                    let totalPool = 0;
                    const totalBets = betsSnap.val() || {};
                    Object.values(totalBets).forEach(bet => totalPool += bet || 0);

                    const winnings = totalPool / winners.length;

                    database.ref(`profiles/${username}/account`).once('value', (accountSnap) => {
                        const account = accountSnap.val() || '123456-7890123456';
                        const qrContainer = document.getElementById('qr-container');
                        qrContainer.innerHTML = `<h5>QR kód pro tvou výhru</h5>`;
                        qrContainer.style.display = 'block';

                        const paymentDetails = `SPD*1.0*ACC:${account}*AM:${winnings.toFixed(2)}*CC:CZK*MSG:Vyhra od ${username}`;
                        QRCode.toCanvas(document.createElement('canvas'), paymentDetails, { width: 200 }, (error, canvas) => {
                            if (error) {
                                showToast('Chyba při generování QR kódu! ❌');
                                return;
                            }
                            qrContainer.appendChild(canvas);
                            showToast(`QR kód vygenerován! 📱`);
                        });
                    });
                });
            });
        }

        // Funkce pro reset bodů a sázek
        function resetPoints() {
            database.ref('points').set({});
            database.ref('totalBets').set({});
            database.ref('bets').remove();
            database.ref('evaluations').remove();
            database.ref('tips').remove();
            database.ref('users').once('value', (snapshot) => {
                const users = snapshot.val() || {};
                Object.keys(users).forEach(username => {
                    document.getElementById(`points-${username}`).textContent = '0';
                    document.getElementById(`bet-${username}`).textContent = '0';
                });
            });
            showToast('Body a sázky resetovány! 🔄');
        }

        // Inicializace aplikace
        async function init() {
            const currentPlayer = sessionStorage.getItem('currentPlayer');
            const rounds = await loadMatches();
            if (rounds.length === 0) {
                document.getElementById('matches-container').innerHTML = '<p class="text-center">Žádné zápasy nenalezeny. 😔</p>';
                return;
            }

            // Načtení uživatelů a dynamické vykreslení
            database.ref('users').on('value', (snapshot) => {
                const users = snapshot.val() || {};
                renderPlayerTable(users);
                renderMatches(rounds, users, currentPlayer);

                // Načtení bodů
                database.ref('points').on('value', (pointsSnapshot) => {
                    const points = pointsSnapshot.val() || {};
                    Object.keys(users).forEach(username => {
                        document.getElementById(`points-${username}`).textContent = points[username] || 0;
                    });
                });

                // Načtení tipů
                database.ref('tips').on('value', (tipsSnapshot) => {
                    const tips = tipsSnapshot.val() || {};
                    Object.keys(users).forEach(username => {
                        if (tips[username]) {
                            for (const roundIndex in tips[username]) {
                                for (const matchIndex in tips[username][roundIndex]) {
                                    const tipInput = document.getElementById(`${username}-tip-${roundIndex}-${matchIndex}`);
                                    if (tipInput) {
                                        tipInput.value = tips[username][roundIndex][matchIndex];
                                    }
                                }
                            }
                        }
                    });
                });

                // Načtení sázek
                database.ref('bets').on('value', (betsSnapshot) => {
                    const bets = betsSnapshot.val() || {};
                    Object.keys(users).forEach(username => {
                        if (bets[username]) {
                            for (const roundIndex in bets[username]) {
                                for (const matchIndex in bets[username][roundIndex]) {
                                    const betInput = document.getElementById(`${username}-bet-${roundIndex}-${matchIndex}`);
                                    if (betInput) {
                                        betInput.value = bets[username][roundIndex][matchIndex];
                                    }
                                }
                                updateTotalBet(username);
                            }
                        }
                    });
                });

                // Načtení vyhodnocení
                database.ref('evaluations').on('value', (evalSnapshot) => {
                    const evaluations = evalSnapshot.val() || {};
                    Object.keys(users).forEach(username => {
                        if (evaluations[username]) {
                            for (const roundIndex in evaluations[username]) {
                                for (const matchIndex in evaluations[username][roundIndex]) {
                                    const evalCell = document.getElementById(`${username}-eval-${roundIndex}-${matchIndex}`);
                                    if (evalCell) {
                                        const status = evaluations[username][roundIndex][matchIndex];
                                        if (status) {
                                            evalCell.innerHTML = `<span class="evaluation-status">${status === 'ok' ? 'OK ✅' : 'ŠPATNĚ ❌'}</span>`;
                                        } else if (username === currentPlayer) {
                                            evalCell.innerHTML = `
                                                <button class="btn btn-success evaluation-btn" onclick="evaluateTip('${username}', ${roundIndex}, ${matchIndex}, 'ok')">OK</button>
                                                <button class="btn btn-danger evaluation-btn" onclick="evaluateTip('${username}', ${roundIndex}, ${matchIndex}, 'spatne')">ŠPATNĚ</button>
                                            `;
                                        } else {
                                            evalCell.innerHTML = '<span class="evaluation-status">Nevyhodnoceno</span>';
                                        }
                                    }
                                }
                            }
                        } else if (username === currentPlayer) {
                            // Pokud žádné vyhodnocení, přidat tlačítka pro všechny zápasy
                            rounds.forEach((round, rIdx) => {
                                round.matches.forEach((match, mIdx) => {
                                    const evalCell = document.getElementById(`${username}-eval-${rIdx}-${mIdx}`);
                                    if (evalCell && !evalCell.innerHTML) {
                                        evalCell.innerHTML = `
                                            <button class="btn btn-success evaluation-btn" onclick="evaluateTip('${username}', ${rIdx}, ${mIdx}, 'ok')">OK</button>
                                            <button class="btn btn-danger evaluation-btn" onclick="evaluateTip('${username}', ${rIdx}, ${mIdx}, 'spatne')">ŠPATNĚ</button>
                                        `;
                                    }
                                });
                            });
                        }
                    });
                });

                // Načtení celkových sázek
                database.ref('totalBets').on('value', (totalBetsSnapshot) => {
                    const totalBets = totalBetsSnapshot.val() || {};
                    Object.keys(users).forEach(username => {
                        document.getElementById(`bet-${username}`).textContent = totalBets[username] || 0;
                    });
                });

                // Načtení profilu (jen pro aktuálního)
                database.ref(`profiles/${currentPlayer}`).on('value', (profileSnapshot) => {
                    const profile = profileSnapshot.val() || {};
                    document.getElementById('my-account').value = profile.account || '';
                });
            });
        }

        // Spuštění při načtení stránky
        window.onload = () => {
            if (sessionStorage.getItem('currentPlayer')) {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                init();
            }
        };
    </script>
</body>
</html>
